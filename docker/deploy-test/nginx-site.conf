server {
    listen 80 default_server;
    server_name _;

    # Passenger serves the Node app from the deploy directory. Restarting is
    # triggered by touching tmp/restart.txt inside app_root — exactly what
    # the deploy workflow's final step does.
    root /home/deploy/sandbox/public;
    passenger_enabled on;
    passenger_app_type node;
    passenger_startup_file app.js;
    passenger_app_root /home/deploy/sandbox;
    passenger_user deploy;
    passenger_app_env production;
    passenger_friendly_error_pages on;

    # cPanel supplies app environment variables through its "Setup Node.js
    # App" UI; Passenger's equivalent is passenger_env_var.
    passenger_env_var DATABASE_URL mysql://rehearse:rehearse@db:3306/blogcms_rehearse;
    passenger_env_var NODE_ENV production;
    passenger_env_var PORT 3000;

    location / {
        passenger_enabled on;
    }
}
