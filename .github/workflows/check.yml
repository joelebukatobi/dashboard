name: Checks

on:
  push:
    # staging is deliberately absent: staging-deploy.yml calls this workflow
    # as its gate, so a push to staging would otherwise produce two runs.
    branches: [main, dev]
  pull_request:
  # Callable as a gate by other workflows.
  workflow_call:

jobs:
  check:
    name: Guardrails, tests, asset build
    runs-on: ubuntu-latest

    services:
      # Several tests boot the app and hit the database — the forgot-password
      # flow writes a reset token, and the smoke tests read site settings.
      # Without a database they either fail or, worse, pass against an app
      # serving defaults because getSettingsMap swallows connection errors.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: blogcms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/blogcms_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Must match the Node version deploy.yml runs on the server, or
          # tests never run on the shipping runtime.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Applies the full migration chain to an empty database on every run —
      # the same path a new fork takes on day one.
      - name: Run migrations
        run: npm run db:migrate

      # --core skips image and video seeding, which shells out to sharp and
      # ffmpeg. Tests only need the admin user and basic content.
      - name: Seed core data
        run: node scripts/seed.js --core

      - name: Guardrails and tests
        run: npm run check

      - name: Verify CSS build
        run: npm run build:css
