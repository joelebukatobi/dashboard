name: Checks

on:
  push:
    # dev is the working branch and main is only ever fast-forwarded from it,
    # so dev being green is the release gate. It has to be checked.
    branches: [main, dev]
  pull_request:

jobs:
  check:
    name: Guardrails, tests, asset build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Node version deploy.yml runs on the server, or
          # tests never run on the shipping runtime.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardrails and tests
        run: npm run check

      - name: Verify CSS build
        run: npm run build:css
