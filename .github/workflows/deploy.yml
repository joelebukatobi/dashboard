name: Deploy

on:
  # Dashboard is a base template and deploys nowhere, so this never runs
  # automatically here. A fork with real hosting adds its own trigger:
  #
  # push:
  #   branches:
  #     - dev
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
      CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
      CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_FTP_HOST }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_FTP_USER }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_PORT: 22
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build:css

      - name: Validate required deploy secrets
        run: bash scripts/deploy/validate-secrets.sh CPANEL_FTP_HOST CPANEL_FTP_USER CPANEL_FTP_PASSWORD DEPLOY_PATH

      - name: Resolve deploy paths
        id: paths
        run: bash scripts/deploy/resolve-paths.sh >> "$GITHUB_OUTPUT"

      - name: Detect SSH configuration
        id: ssh_check
        run: |
          if [ -n "$CPANEL_SSH_HOST" ] && [ -n "$CPANEL_SSH_USER" ] && [ -n "$CPANEL_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.CPANEL_FTP_HOST }}
          username: ${{ env.CPANEL_FTP_USER }}
          password: ${{ env.CPANEL_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: ${{ steps.paths.outputs.ftp_dir }}
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/public/uploads/**
            **/.git*/**
            **/.git*
            **/node_modules/**
            **/.env*
            **/.github/**
            **/.DS_Store
            **/tmp/**
            **/.vscode/**
            **/.idea/**
            **/.build/**

      - name: Install production dependencies and restart app
        if: steps.ssh_check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.CPANEL_SSH_HOST }}
          username: ${{ env.CPANEL_SSH_USER }}
          key: ${{ env.CPANEL_SSH_KEY }}
          port: ${{ env.CPANEL_SSH_PORT }}
          envs: DATABASE_URL
          script: |
            set -e
            set -o pipefail

            # Source .bashrc to get Node 24 in PATH
            if [ -f ~/.bashrc ]; then
              source ~/.bashrc
            fi

            DEPLOY_DIR="${{ steps.paths.outputs.deploy_dir }}"
            cd "$DEPLOY_DIR"

            echo "Deploy diagnostics:"
            echo "- working directory: $(pwd)"
            if [ -n "$DATABASE_URL" ]; then
              echo "- DATABASE_URL: present"
            else
              echo "- DATABASE_URL: missing"
            fi

            echo "- Node version: $(node --version)"

            LOCK_HASH_FILE=".package-lock.sha256"
            CURRENT_LOCK_HASH="$(sha256sum package-lock.json | awk '{print $1}')"
            PREVIOUS_LOCK_HASH=""

            if [ -f "$LOCK_HASH_FILE" ]; then
              PREVIOUS_LOCK_HASH="$(cat "$LOCK_HASH_FILE")"
            fi

            if [ ! -d node_modules ] || [ "$CURRENT_LOCK_HASH" != "$PREVIOUS_LOCK_HASH" ]; then
              echo "Installing production dependencies"
              npm ci --omit=dev --no-audit --no-fund
              printf '%s\n' "$CURRENT_LOCK_HASH" > "$LOCK_HASH_FILE"
            else
              echo "Skipping dependency install (lockfile unchanged)"
            fi

            if [ -z "$DATABASE_URL" ]; then
              echo "DATABASE_URL secret is required for migrations"
              exit 1
            fi

            # Check database connectivity
            node --input-type=module -e "import mysql from 'mysql2/promise'; const conn = await mysql.createConnection(process.env.DATABASE_URL); await conn.query('SELECT 1'); await conn.end(); console.log('Database connectivity check: OK');"

            # Run migrations using drizzle-kit migrate
            npm run db:migrate
            echo "Database migrations: OK"

            # NOTE: Database seeding is disabled. Use setup wizard instead.

            echo "✅ Deployment complete. Run 'node scripts/cli.js setup-token' to generate setup URL."

            mkdir -p tmp
            date > tmp/restart.txt

      - name: Verify deployed files on server
        if: steps.ssh_check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.CPANEL_SSH_HOST }}
          username: ${{ env.CPANEL_SSH_USER }}
          key: ${{ env.CPANEL_SSH_KEY }}
          port: ${{ env.CPANEL_SSH_PORT }}
          script: |
            set -e
            DEPLOY_DIR="${{ steps.paths.outputs.deploy_dir }}"
            cd "$DEPLOY_DIR"
            pwd
            ls -la

      - name: Health check - verify app responds
        if: steps.ssh_check.outputs.enabled == 'true'
        run: |
          set -e
          echo "Waiting for app to start..."
          sleep 10

          if [ -z "${{ secrets.SANDBOX_URL }}" ]; then
            echo "::error::Missing secret: SANDBOX_URL — set it to this site's base URL"
            exit 1
          fi
          HEALTH_URL="${{ secrets.SANDBOX_URL }}/health"
          echo "Checking health at: $HEALTH_URL"

          # Retry up to 3 times with 5 second intervals
          for i in 1 2 3; do
            if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "✅ Health check passed - app is responding"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "❌ Health check failed - app is not responding"
          exit 1
