# Local rehearsal of the cPanel deploy pipeline.
#   npm run deploy:rehearse
#
# Three stand-ins for the hosting account the workflows target:
#   cpanel - Passenger + nginx + sshd, the app host
#   ftp    - pure-ftpd sharing cpanel's home directory
#   db     - throwaway MySQL, so migrations run against a fresh database
name: dashboard-deploy-test

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rehearse
      MYSQL_DATABASE: blogcms_rehearse
      MYSQL_USER: rehearse
      MYSQL_PASSWORD: rehearse
    ports:
      - '13306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-prehearse']
      interval: 3s
      timeout: 5s
      retries: 30

  cpanel:
    build:
      context: ./docker/deploy-test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '2222:22'
      - '8080:80'
    volumes:
      - deploy_home:/home/deploy
      - ./.tmp/deploy-test/ssh:/ssh-keys:ro

  ftp:
    image: stilliard/pure-ftpd:hardened
    depends_on:
      - cpanel
    environment:
      PUBLICHOST: localhost
      FTP_USER_NAME: deploy
      FTP_USER_PASS: rehearse
      FTP_USER_HOME: /home/deploy
      FTP_USER_UID: 1001
      FTP_USER_GID: 1001
      # uid/gid must match DEPLOY_UID/DEPLOY_GID in docker/deploy-test/Dockerfile
    ports:
      - '2121:21'
      - '30000-30009:30000-30009'
    volumes:
      - deploy_home:/home/deploy

volumes:
  deploy_home:
